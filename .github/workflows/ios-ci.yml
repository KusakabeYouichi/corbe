name: iOS CI

# git に入っている状態だけから Release ビルドが通るかを見る(écritu の iOS CI に倣う)。
# 拾いたいのは手元では気づけない失敗(pbxproj の登録漏れ・コミットし忘れ・新しい clone だけで壊れる設定・Release だけのコンパイラ異常終了)。
# 検索の単体テスト(swift test)は生成済みの索引だけを読み、取得の前提が無いので、ここでも回す。UI テストは手元で回す
on:
  push:
    branches:
      - main
  workflow_dispatch:

# CI は検査だけなので、渡される鍵は読み取りだけにする
permissions:
  contents: read

jobs:
  release-build:
    # macos-26 には Xcode 26 しか無い。Xcode 27 は専用イメージ(公開プレビュー)にある
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        # タグは動かせるのでコミットで固定する(v4.4.0。écritu と同じ)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # régu と同じ 27.1 に固定する(手元は 27.2 で確認済み)
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      - name: Normalize shared scheme
        run: bash tools/normalize_unicode_project_names.sh

      - name: Swift style check
        run: bash tools/check_top_level_brace_blank_lines.sh

      # アプリのライセンス画面が出す Unicode License は third_party の原本の複製。食い違いを止める
      - name: Bundled license copy matches third_party
        run: cmp third_party/unicode/UNICODE-LICENSE.txt Packages/CorbeKit/Sources/CorbeUI/Resources/UNICODE-LICENSE.txt

      - name: Unit tests (CorbeKit)
        working-directory: Packages/CorbeKit
        run: swift test

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "corbé.xcodeproj" \
            -scheme "corbé" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build-ci" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
